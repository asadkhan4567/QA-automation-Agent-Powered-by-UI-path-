name: qa-e2e

# Triggered by UiPath "Trigger and Monitor CI" via POST /repos/{owner}/{repo}/actions/workflows/qa-e2e.yml/dispatches
# and by the Verify Fixed Bugs sub-process with grep=@module, repeat_each=10, retries=0.
on:
  workflow_dispatch:
    inputs:
      grep:
        description: "Playwright --grep filter (e.g. @checkout or @UIP-773). Empty = full suite."
        required: false
        default: ""
      repeat_each:
        description: "Repeat each test N times (1 for design runs, 10 for fix verification)."
        required: false
        default: "1"
      retries:
        description: "Retries per test (0 for fix verification so flakiness cannot pass)."
        required: false
        default: "2"
      base_url:
        description: "Application under test (Orchestrator asset QA_BaseUrl)."
        required: false
        default: "https://www.saucedemo.com"
      run_ref:
        description: "Correlation id from Maestro (queue item reference / Jira key)."
        required: false
        default: "manual"
  push:
    branches: [main]
    paths: ["tests/**", "pages/**", "playwright.config.ts", "package.json", ".github/workflows/qa-e2e.yml"]
  pull_request:
    paths: ["tests/**", "pages/**", "playwright.config.ts"]

concurrency:
  group: qa-e2e-${{ github.ref }}-${{ inputs.run_ref || 'push' }}
  cancel-in-progress: false

jobs:
  e2e:
    name: Playwright (${{ inputs.run_ref || github.event_name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
      BASE_URL: ${{ inputs.base_url || 'https://www.saucedemo.com' }}
      RETRIES: ${{ inputs.retries || '2' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci || npm install

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run tests
        id: run
        shell: bash
        run: |
          ARGS="--repeat-each=${{ inputs.repeat_each || '1' }}"
          if [ -n "${{ inputs.grep }}" ]; then ARGS="$ARGS --grep ${{ inputs.grep }}"; fi
          echo "Running: npx playwright test $ARGS (retries=$RETRIES, base=$BASE_URL)"
          npx playwright test $ARGS

      - name: Summarise results.json
        if: always()
        shell: bash
        run: |
          node -e '
            const r=require("./test-results/results.json");
            const s=r.stats||{};
            const line=`expected=${s.expected} unexpected=${s.unexpected} flaky=${s.flaky} skipped=${s.skipped}`;
            console.log(line);
            require("fs").appendFileSync(process.env.GITHUB_STEP_SUMMARY, `### QA E2E (${process.env.RUN_REF})\n${line}\n`);
          '
        env:
          RUN_REF: ${{ inputs.run_ref || github.event_name }}

      # Artifact name "results" is the contract read by the UiPath CI step (downloads results.json).
      - name: Upload results.json
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results
          path: test-results/results.json
          retention-days: 14

      - name: Upload HTML report and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 14
